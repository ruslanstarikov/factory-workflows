name: Publish worker image

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/publish-worker.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/ruslanstarikov/factory-worker:main
            ghcr.io/ruslanstarikov/factory-worker:sha-${{ github.sha }}